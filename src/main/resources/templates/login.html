<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Iniciar sesión | Bóveda Segura</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body class="pagina-login">

<main class="tarjeta login">

    <p class="etiqueta">PROYECTO ACADÉMICO</p>

    <h1>Bóveda Segura</h1>

    <p class="subtitulo">
        Ingresa para consultar y proteger tus documentos.
    </p>

    <p class="mensaje error" th:if="${param.error}">
        Usuario o contraseña incorrectos.
    </p>

    <p class="mensaje exito" th:if="${param.salio}">
        La sesión se cerró correctamente.
    </p>

    <form th:action="@{/login}" method="post" class="formulario">

        <label for="username">Usuario</label>

        <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
        >

        <label for="password">Contraseña</label>

        <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
        >

        <button type="submit">
            Ingresar
        </button>

    </form>

</main>

</body>
</html>

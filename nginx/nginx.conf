# Límite promedio por dirección IP.
limit_req_zone $binary_remote_addr zone=boveda:10m rate=5r/s;

# El puerto HTTP redirige al acceso HTTPS local.
server {
    listen 80;
    server_name localhost;

    server_tokens off;

    return 308 https://localhost:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Oculta el número de versión de Nginx.
    server_tokens off;

    # Certificado de prueba para localhost.
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # La aplicación permite archivos de hasta 20 MB.
    # La solicitud completa tiene un poco más de espacio.
    client_max_body_size 21m;

    # Código para peticiones que superen el límite de tasa.
    limit_req_status 429;

    # Páginas de error que puede mostrar el propio Nginx.
    error_page 413 /errores-nginx/413.html;
    error_page 429 /errores-nginx/429.html;
    error_page 500 502 503 504 /errores-nginx/5xx.html;

    # Cabeceras de seguridad.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Páginas disponibles para los errores internos de Nginx.
    location /errores-nginx/ {
        internal;
        alias /usr/share/nginx/errores/;
    }

    # Envía las peticiones a Spring Boot.
    location / {
        limit_req zone=boveda burst=20 nodelay;

        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;

        # Evitamos duplicar estas cabeceras.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;

        proxy_set_header Host localhost:8443;
        proxy_set_header X-Forwarded-Host localhost:8443;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header Forwarded "";
    }
}
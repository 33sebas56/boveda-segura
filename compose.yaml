services:
  nginx:
    image: nginx:alpine
    container_name: boveda-nginx

    ports:
      - "127.0.0.1:8085:80"
      - "127.0.0.1:8443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./src/main/resources/templates/error:/usr/share/nginx/errores:ro
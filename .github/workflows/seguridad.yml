name: Seguridad - Boveda Segura

on:
  workflow_dispatch:
  # push:
  # pull_request:

permissions:
  contents: read

jobs:
  construir-y-analizar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Construir la imagen de la aplicacion
        run: docker build -t boveda-segura:revision .

      - name: Analizar la imagen con Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.2 \
            image --scanners vuln --format table \
            --severity HIGH,CRITICAL --exit-code 1 \
            --timeout 10m boveda-segura:revision